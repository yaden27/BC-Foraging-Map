<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback — BC Foraging Map</title><link rel="stylesheet" href="style.css"></head><body><header><div class="wrap nav"><a class="brand" href="./">BC Foraging Map</a><nav><a href="./">Home / 首页</a><a href="feedback.html">Feedback / 反馈</a><a href="donate.html">Support / 支持</a></nav></div></header><main class="wrap"><div class="panel"><p class="eyebrow">COMMUNITY FEEDBACK</p><h1>Feedback / 反馈建议</h1><p>发现地图错误、步道遗漏，或者有功能建议？请告诉我们。填写后将打开设备上的邮件应用；本站不会自动发送邮件。</p><form id="feedbackForm"><label for="category">Topic / 类型</label><select id="category"><option>Map data error / 地图错误</option><option>Trail information / 步道信息</option><option>Feature suggestion / 功能建议</option><option>Other / 其他</option></select><label for="message">Description / 反馈内容</label><textarea id="message" required minlength="5" placeholder="Describe the location, coordinates or feature... / 请描述地点、坐标或建议……"></textarea><button type="submit">Compose email / 打开邮件</button></form><p class="small">Email: <a href="mailto:markinzhang7@gmail.com">markinzhang7@gmail.com</a></p></div></main><footer class="wrap">BC Foraging Map</footer><script>document.getElementById('feedbackForm').addEventListener('submit',e=>{e.preventDefault();const topic=document.getElementById('category').value;const message=document.getElementById('message').value.trim();if(!message)return;const subject='BC Foraging Map feedback: '+topic;const body='Topic: '+topic+'\n\n'+message+'\n\nMap URL (optional): ';window.location.href='mailto:markinzhang7@gmail.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);});</script></body></html>
